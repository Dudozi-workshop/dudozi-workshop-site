name: Preview workshop website

# One-time user-requested R5.4 PC 1440 Master v0.2 preview.
# Restore manual-only operation as soon as deployment completes.
on:
  workflow_dispatch:
  push:
    branches:
      - feat/homepage-r54-static-cards-20261104
    paths:
      - '.github/workflows/preview.yml'

permissions:
  contents: read

concurrency:
  group: workshop-preview-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/feat/homepage-r54-static-cards-20261104' && contains(github.event.head_commit.message, '[r54-pc-1440-master-v02]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: dudozi-workshop-site
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build website
        run: npm run build
      - name: Choose preview branch
        shell: bash
        run: |
          RAW_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          PREVIEW_BRANCH="${RAW_BRANCH//\//-}"
          echo "PREVIEW_BRANCH=$PREVIEW_BRANCH" >> "$GITHUB_ENV"
          echo "Preview branch: $PREVIEW_BRANCH"
      - name: Check deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=dudozi-workshop-site --branch=${{ env.PREVIEW_BRANCH }}
