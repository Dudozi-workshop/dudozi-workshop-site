name: Preview workshop website

on:
  push:
    branches: [feat/homepage-visual-r3-hifi]
  pull_request:
    branches: [main]
    paths:
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workshop-preview-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: dudozi-workshop-site
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build website
        run: npm run build
      - name: Choose preview branch
        shell: bash
        run: |
          RAW_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          PREVIEW_BRANCH="${RAW_BRANCH//\//-}"
          echo "PREVIEW_BRANCH=$PREVIEW_BRANCH" >> "$GITHUB_ENV"
          echo "Preview branch: $PREVIEW_BRANCH"
      - name: Check deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=dudozi-workshop-site --branch=${{ env.PREVIEW_BRANCH }}
