name: Deploy workshop website

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workshop-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: dudozi-workshop-site
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build website
        run: npm run build
      - name: Check deployment credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Set production branch
        run: |
          node --input-type=module <<'JS'
          const { CLOUDFLARE_ACCOUNT_ID: account, CLOUDFLARE_API_TOKEN: token, PAGES_PROJECT: project } = process.env;
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/pages/projects/${project}`, {
            method: 'PATCH',
            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ production_branch: 'main' })
          });
          const result = await response.json();
          if (!response.ok || !result.success) throw new Error('Could not set Pages production branch. Check account ID and Cloudflare Pages Edit token permission.');
          JS
      - name: Add deployment revision
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          writeFileSync('dist/deployment.json', JSON.stringify({ commit: process.env.GITHUB_SHA }));
          JS
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=dudozi-workshop-site --branch=main
      - name: Verify production revision
        run: |
          node --input-type=module <<'JS'
          const base = 'https://dudozi-workshop-site.pages.dev';
          for (let attempt = 0; attempt < 12; attempt++) {
            try {
              const response = await fetch(`${base}/deployment.json?revision=${process.env.GITHUB_SHA}&attempt=${attempt}`, { cache: 'no-store' });
              const revision = await response.json();
              if (response.ok && revision.commit === process.env.GITHUB_SHA) {
                const page = await fetch(base);
                if (!page.ok || !(await page.text()).includes('두도지공방')) throw new Error('Homepage verification failed');
                console.log('Production website matches this commit.');
                process.exit(0);
              }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw new Error('Production revision could not be verified.');
          JS
