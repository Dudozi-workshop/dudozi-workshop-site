name: Check website preview

on:
  push:
    branches:
      - feat/homepage-hero-r2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check homepage and app detail routes
        run: npm run check
      - name: Build static site
        run: npm run build
